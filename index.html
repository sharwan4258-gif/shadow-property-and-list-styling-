<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="css list styling  ">
    <title>video 25 nav bar</title>
    <style>
        ul {
            display: flex;
            border: 2px solid black;
            


        }

        /* we can remove the dot in the list tag by using some css property list style */

        /*list-style-position: inside;  is property ko use kr ke hm apne list dot ya number ko inside kr sakte hn jo by default bahar hoti hn using this  /* list-style-image: url(hindalco.jpg); we can add image  */

        nav ul li {
            padding: 23px;
            
            /* background-color: red; */
            list-style-position: inside;
            /* border: 2px solid black; */
            /* list-style-image: url(hindalco.jpg); */
            
            list-style-type: decimal;



        }
    </style>
</head>

<body>
    <!-- list tag have display list property -->
    <nav>
        <ul>
            <li>home</li>
            <li>abouth</li>
            <li>countact</li>
        </ul>
    </nav>
</body>

</html>
